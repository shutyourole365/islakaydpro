jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Android signing secrets
        if: ${{ secrets.ANDROID_KEYSTORE != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          echo 'All signing secrets are present.'
      - name: Continue with build
        run: |
          echo 'Building the Android app.'