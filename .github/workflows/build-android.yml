---
name: Build Android APK/AAB

"on":
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'aab'
        type: choice
        options:
          - apk
          - aab

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode Keystore
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/keystore.jks
            echo "Keystore decoded"
          else
            echo "No keystore — building unsigned"
          fi
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Release AAB
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == '' }}
        env:
          SIGN_STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGN_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGN_KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -f "app/keystore.jks" ]; then
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \
              -Pandroid.injected.signing.store.password=$SIGN_STORE_PW \
              -Pandroid.injected.signing.key.alias=$SIGN_ALIAS \
              -Pandroid.injected.signing.key.password=$SIGN_KEY_PW
          else
            ./gradlew bundleRelease
          fi

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'apk' }}
        env:
          SIGN_STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGN_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGN_KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -f "app/keystore.jks" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \
              -Pandroid.injected.signing.store.password=$SIGN_STORE_PW \
              -Pandroid.injected.signing.key.alias=$SIGN_ALIAS \
              -Pandroid.injected.signing.key.password=$SIGN_KEY_PW
          else
            ./gradlew assembleRelease
          fi

      - name: Upload AAB
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload APK
        if: ${{ github.event.inputs.build_type == 'apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload to Google Play (Internal Testing)
        run: |
          if [ -n "$GP_SA_JSON" ]; then
            echo "Google Play upload configured — handled by r0adkll/upload-google-play"
          else
            echo "No Google Play service account — skipping upload"
          fi
        env:
          GP_SA_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
