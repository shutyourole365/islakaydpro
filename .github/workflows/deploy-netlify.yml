name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://purmabjcvznntttvtseb.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1cm1hYmpjdnpubnR0dHZ0c2ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0NzY0NTMsImV4cCI6MjA3NjA1MjQ1M30.caFfzlDTmFf61Jf4EGI-i1WwBSzIjb6GMXzZ7OQuaQc
          VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY }}
          VITE_ENABLE_AI: 'true'
          VITE_ENABLE_PWA: 'true'
          VITE_ENABLE_AI_ASSISTANT: 'true'

      - name: Deploy to Netlify
        run: npx --yes netlify-cli@26.0.1 deploy --dir=dist --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 0b410351-0cf3-4111-9836-7953f8eea633
