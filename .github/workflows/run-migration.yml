name: Run DB Migration
on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client dnsutils

      - name: DNS lookup for DB host
        run: |
          echo "=== DNS for direct DB ==="
          host db.purmabjcvznntttvtseb.supabase.co || true
          echo "=== DNS for pooler ==="
          host aws-0-us-east-2.pooler.supabase.com || true

      - name: Test connection with URL-encoded password
        run: |
          echo "--- URL-encoded pass, pooler port 5432 ---"
          psql "postgresql://postgres.purmabjcvznntttvtseb:Kaydeni%24la21123@aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require" -c "SELECT 1" 2>&1 || true

          echo "--- URL-encoded pass, pooler port 6543 ---"
          psql "postgresql://postgres.purmabjcvznntttvtseb:Kaydeni%24la21123@aws-0-us-east-2.pooler.supabase.com:6543/postgres?sslmode=require" -c "SELECT 1" 2>&1 || true

          echo "--- Using PGPASSWORD env var, pooler port 5432 ---"
          PGPASSWORD=${{ secrets.SUPABASE_DB_PASS }} psql "host=aws-0-us-east-2.pooler.supabase.com port=5432 dbname=postgres user=postgres.purmabjcvznntttvtseb sslmode=require" -c "SELECT 1" 2>&1 || true
