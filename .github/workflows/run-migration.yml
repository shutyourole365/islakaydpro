name: Run DB Migration
on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run migration via Supabase REST API
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Use Supabase REST API with service role key to run SQL via RPC
          # Read migration file
          SQL=$(cat supabase/migrations/20260426000000_fix_conversations_participants.sql)
          
          # Use Supabase's pg_dump or query via service role
          node -e "
          const https = require('https');
          const fs = require('fs');
          
          const serviceKey = process.env.SUPABASE_SERVICE_KEY;
          const projectRef = 'purmabjcvznntttvtseb';
          const sql = fs.readFileSync('supabase/migrations/20260426000000_fix_conversations_participants.sql', 'utf8');
          
          const postData = JSON.stringify({ query: sql });
          
          const options = {
            hostname: 'api.supabase.com',
            path: '/v1/projects/' + projectRef + '/database/query',
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + serviceKey,
              'Content-Type': 'application/json',
              'Content-Length': Buffer.byteLength(postData)
            }
          };
          
          const req = https.request(options, (res) => {
            let data = '';
            res.on('data', (chunk) => { data += chunk; });
            res.on('end', () => {
              console.log('Status:', res.statusCode);
              console.log('Response:', data.substring(0, 500));
              if (res.statusCode >= 400) {
                process.exit(1);
              }
            });
          });
          
          req.on('error', (e) => { console.error(e); process.exit(1); });
          req.write(postData);
          req.end();
          "

      - name: Run migration via node-postgres (fallback)
        if: failure()
        env:
          SUPABASE_DB_PASS: ${{ secrets.SUPABASE_DB_PASS }}
        run: |
          npm install pg --save-dev --silent
          node -e "
          const { Client } = require('pg');
          const fs = require('fs');
          const sql = fs.readFileSync('supabase/migrations/20260426000000_fix_conversations_participants.sql', 'utf8');
          
          const client = new Client({
            connectionString: 'postgresql://postgres.purmabjcvznntttvtseb:' + encodeURIComponent(process.env.SUPABASE_DB_PASS) + '@aws-0-ap-southeast-2.pooler.supabase.com:6543/postgres',
            ssl: { rejectUnauthorized: false }
          });
          
          client.connect()
            .then(() => { console.log('Connected'); return client.query(sql); })
            .then(() => { console.log('Migration done!'); return client.end(); })
            .catch(e => { console.error('Error:', e.message); process.exit(1); });
          "
