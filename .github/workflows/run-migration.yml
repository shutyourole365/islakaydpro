name: Run DB Migration
on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run migration via node-postgres
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          npm install pg --save-dev --silent
          node -e "
          const { Client } = require('pg');
          const fs = require('fs');
          const sql = fs.readFileSync('supabase/migrations/20260426000000_fix_conversations_participants.sql', 'utf8');
          
          // Try direct connection first, fall back to pooler
          const configs = [
            {
              host: 'db.purmabjcvznntttvtseb.supabase.co',
              port: 5432,
              database: 'postgres',
              user: 'postgres',
              password: process.env.DB_PASSWORD,
              ssl: { rejectUnauthorized: false }
            },
            {
              host: 'aws-0-ap-southeast-2.pooler.supabase.com',
              port: 5432,
              database: 'postgres',
              user: 'postgres.purmabjcvznntttvtseb',
              password: process.env.DB_PASSWORD,
              ssl: { rejectUnauthorized: false }
            }
          ];
          
          async function tryConnect(config) {
            const client = new Client(config);
            await client.connect();
            console.log('Connected via', config.host + ':' + config.port);
            await client.query(sql);
            console.log('Migration applied successfully!');
            await client.end();
          }
          
          async function run() {
            for (const config of configs) {
              try {
                await tryConnect(config);
                return;
              } catch(e) {
                console.log('Failed:', config.host + ':' + config.port, e.message);
              }
            }
            process.exit(1);
          }
          
          run().catch(e => { console.error(e); process.exit(1); });
          "
