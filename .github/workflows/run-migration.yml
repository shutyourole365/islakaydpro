name: Run DB Migration
on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run migration via node-postgres
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          npm install pg --save-dev --silent 2>/dev/null
          node << 'NODEOF'
          const { Client } = require('pg');
          const fs = require('fs');
          const path = require('path');
          
          const migFile = 'supabase/migrations/20260426000000_fix_conversations_participants.sql';
          if (!fs.existsSync(migFile)) {
            console.log('Migration file not found:', migFile);
            process.exit(1);
          }
          const sql = fs.readFileSync(migFile, 'utf8');
          
          const client = new Client({
            host: 'aws-0-ap-southeast-2.pooler.supabase.com',
            port: 6543,
            database: 'postgres',
            user: 'postgres.purmabjcvznntttvtseb',
            password: process.env.DB_PASSWORD,
            ssl: { rejectUnauthorized: false }
          });
          
          async function run() {
            await client.connect();
            console.log('Connected to database');
            try {
              await client.query(sql);
              console.log('Migration applied successfully');
            } catch (e) {
              console.error('Migration error:', e.message);
              await client.end();
              process.exit(1);
            }
            await client.end();
          }
          
          run().catch(e => { console.error(e); process.exit(1); });
          NODEOF
