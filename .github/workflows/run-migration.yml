name: Run DB Migration
on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y postgresql-client

      - name: Run Migration via Pooler (Transaction mode port 6543)
        run: |
          echo "Trying pooler us-east-2 port 6543..."
          PGPASSWORD='Kaydeni$la21123' psql \
            "postgresql://postgres.purmabjcvznntttvtseb@aws-0-us-east-2.pooler.supabase.com:6543/postgres?sslmode=require" \
            -f supabase/migrations/20260418102009_align_schema_with_codebase.sql \
            2>&1 && echo "SUCCESS" || echo "FAILED - trying direct..."

      - name: Try direct connection if pooler failed
        run: |
          echo "Trying direct DB connection..."
          PGPASSWORD='Kaydeni$la21123' psql \
            "postgresql://postgres@db.purmabjcvznntttvtseb.supabase.co:5432/postgres?sslmode=require" \
            -f supabase/migrations/20260418102009_align_schema_with_codebase.sql \
            2>&1 || echo "Direct also failed"

      - name: Verify tables created
        run: |
          PGPASSWORD='Kaydeni$la21123' psql \
            "postgresql://postgres.purmabjcvznntttvtseb@aws-0-us-east-2.pooler.supabase.com:6543/postgres?sslmode=require" \
            -c "SELECT tablename FROM pg_tables WHERE schemaname='public' AND tablename IN ('equipment','categories','payouts','equipment_availability') ORDER BY tablename;" \
            2>&1 || true
