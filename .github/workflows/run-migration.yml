name: Run DB Migration
on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Test supabase db query --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # First link the project
          supabase link --project-ref purmabjcvznntttvtseb

          # Try db query with --linked flag (uses Management API, no direct DB)
          echo "Testing with --linked..."
          supabase db query --linked "SELECT 1 as test" 2>&1 || true
          
          echo "---"
          # Try with --project-ref instead
          echo "Testing with --project-ref..."
          supabase db query --project-ref purmabjcvznntttvtseb "SELECT 1 as test" 2>&1 || true
          
          echo "---"
          # Check available db subcommands
          supabase db --help 2>&1 | head -20
