name: Run DB Migration
on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DB_PASS: ${{ secrets.SUPABASE_DB_PASS }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Test connection methods
        run: |
          echo "--- Method 1: Direct host ---"
          PGPASSWORD="${DB_PASS}" psql "postgresql://postgres@db.purmabjcvznntttvtseb.supabase.co:5432/postgres?sslmode=require" -c "SELECT 1" 2>&1 || echo "Method 1 failed"
          
          echo "--- Method 2: Pooler US-east-2 port 5432 ---"
          PGPASSWORD="${DB_PASS}" psql "postgresql://postgres.purmabjcvznntttvtseb@aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require" -c "SELECT 1" 2>&1 || echo "Method 2 failed"
          
          echo "--- Method 3: Pooler US-east-2 port 6543 ---"
          PGPASSWORD="${DB_PASS}" psql "postgresql://postgres.purmabjcvznntttvtseb@aws-0-us-east-2.pooler.supabase.com:6543/postgres?sslmode=require" -c "SELECT 1" 2>&1 || echo "Method 3 failed"

          echo "--- Method 4: Pooler with just postgres user ---"
          PGPASSWORD="${DB_PASS}" psql "postgresql://postgres@aws-0-us-east-2.pooler.supabase.com:5432/postgres?options=project%3Dpurmabjcvznntttvtseb&sslmode=require" -c "SELECT 1" 2>&1 || echo "Method 4 failed"
