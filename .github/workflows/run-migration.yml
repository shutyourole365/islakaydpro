name: Run DB Migration
on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy migration edge function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy run-migration \
            --project-ref purmabjcvznntttvtseb \
            --no-verify-jwt
          echo "Function deployed!"

      - name: Run migration via edge function
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "Calling migration function..."
          RESULT=$(curl -s -X POST \
            "https://purmabjcvznntttvtseb.supabase.co/functions/v1/run-migration" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            --max-time 60)
          echo "Result: $RESULT"
          
          # Check if it succeeded
          echo "$RESULT" | python3 -c "
import json,sys
try:
    d=json.load(sys.stdin)
    if d.get('success'):
        print('✅ Migration succeeded!')
        for step in d.get('steps',[]):
            print(f'  {step}')
    else:
        print('❌ Migration failed:', d.get('error'))
        sys.exit(1)
except:
    print('Raw response:', sys.stdin.read())
    sys.exit(1)
" 2>/dev/null || python3 -c "print('$RESULT'[:500])"

      - name: Cleanup - delete edge function
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions delete run-migration \
            --project-ref purmabjcvznntttvtseb || true
          echo "Function cleaned up"
