name: Run DB Migration
on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run migration SQL via Supabase CLI
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Running migration via supabase db execute..."
          supabase db execute \
            --project-ref purmabjcvznntttvtseb \
            --file supabase/migrations/20260418102009_align_schema_with_codebase.sql
          echo "Done!"
