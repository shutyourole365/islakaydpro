name: Run DB Migration
on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASS }}
        run: |
          supabase link --project-ref purmabjcvznntttvtseb

      - name: Push migrations via Supabase CLI
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASS }}
        run: |
          echo "Pushing migrations..."
          supabase db push --project-ref purmabjcvznntttvtseb || true
          echo "Migration push done"

      - name: Verify tables exist
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db query \
            --project-ref purmabjcvznntttvtseb \
            "SELECT tablename FROM pg_tables WHERE schemaname='public' AND tablename IN ('equipment','categories','payouts','equipment_availability') ORDER BY tablename;" || true
